name: Agent permission review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
      - uses: emanalshazly/monna-agent-permission-diff/pr-review@0f0be5d4df066dec37856fbb014ac8d8a5009f0c
        with:
          fail-on: medium
      - name: Save review report even when review is required
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: permission-review-report
          path: ${{ runner.temp }}/monna-pr-review.md
          if-no-files-found: error
          retention-days: 14
